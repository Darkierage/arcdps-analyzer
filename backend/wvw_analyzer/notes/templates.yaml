# Note templates for detector findings.
# {placeholders} are filled from the finding's evidence. Copy this file to
# <data dir>/templates.yaml and edit it to customize the wording for your guild;
# keys you leave out fall back to these defaults. 'short' / 'fix_short' are the one-line
# versions used for the chat debrief (LLM input).

stab_gap_deaths:
  short: '{downs} downed in one burst, {deaths} of them died; stab was low in party {parties}.{repeat_txt}'
  fix_short: Stagger firebrands and hold stab for the enemy push.
  title: "Stability gap during enemy bomb ({time})"
  cause: >-
    At {time}, {downs} players went down in one burst ({deaths} died). Stability coverage just
    before was low in party {parties}, and {nostab} of the {downs} downed players had no stability.
    This happened {bombs} time(s) this fight ({bomb_times}).
  fix: >-
    Keep stability ready for the enemy push, not the approach. Stagger the firebrands (one opens,
    one holds for the enemy bomb), call stab right before contact, and re-stab after the first
    exchange.

stab_gap_deaths_nostab:
  short: '{downs} downed in one burst, {deaths} of them died; {nostab} had no stab even though their parties had stab just before (stripped or ran out).{repeat_txt}'
  fix_short: Re-apply stab right after their strips, before their bomb.
  title: "Players went down without stability ({time})"
  cause: >-
    At {time}, {downs} players went down in one burst ({deaths} died). {nostab} of them had no
    stability at that moment, even though their parties' coverage was {parties} just before, so
    stability was likely stripped or ran out right as the enemy bomb hit. This happened
    {bombs} time(s) this fight ({bomb_times}).
  fix: >-
    Time stability for the moment of contact, not the approach: re-apply it right after the
    enemy's strip/corrupt skills and before their damage bomb, and keep a second firebrand's stab
    in reserve for that window.

boon_wipe:
  short: '{time}: our boons dropped from {before} to {after} per player and {downs} downs followed.'
  fix_short: Re-apply boons right after their strip bomb; use aegis and blocks.
  title: "Enemy strip/corrupt bomb landed ({time})"
  cause: >-
    At {time} the squad's average boons dropped from {before} to {after} per player within
    seconds, and {downs} downs followed. It happened {count} time(s) ({times}). In total enemies
    stripped {boons_lost} boons from you; you stripped {strips}.
  fix: >-
    Answer strip bombs with immediate boon reapplication (stab, resistance, protection), and use
    aegis, blocks or distortions to absorb the incoming bomb. Don't stand in the enemy's
    corrupt/well fields while boonless; move the blob out, then re-engage.

strip_balance:
  short: 'we lost {boons_lost} boons to strips and stripped {strips}; real strippers: {strippers}.'
  fix_short: More strip builds; strip right before our bomb.
  title: "Losing the strip war"
  cause: >-
    Enemies removed {boons_lost} boons from the squad, while the squad stripped {strips}
    ({per_enemy_min} strips per enemy per minute). Only {strippers} player(s) contributed
    meaningful strips: {top_strippers}.
  fix: >-
    Bring or activate more strip-capable builds (spellbreaker, scourge, reaper, chrono...) and
    time the strip skills to land right before your damage bomb, so the enemy loses stability and
    protection when the burst hits.

strip_balance_good:
  short: we stripped {strips} boons and lost {boons_lost}.
  title: "Won the strip war"
  cause: "The squad stripped {strips} boons and lost only {boons_lost}. Top strippers: {top_strippers}."
  fix: "Keep it up."

out_of_position:
  short: '{far_downs} of {downs} downs happened far from the tag or the stack.'
  fix_short: Stay within about {far_tag} of the tag; stop chasing.
  title: "Players caught away from the tag"
  cause: >-
    {far_downs} of {downs} downs ({share}%) happened far from the commander or the stack (median
    {median_dist} distance). Players caught: {players}. Professions: {professions}.
  fix: >-
    Stay within about {far_tag} of the tag, inside boon and heal range. The backline should stick
    to its supports instead of drifting, and players should stop chasing kills away from the
    blob.

early_cascade:
  short: '{downs} downed within {seconds}s from {time}; enemy downs by then: {enemy_downs}.'
  fix_short: Engage only with full boons, pre-stacked on the tag.
  title: "Lost the opening exchange"
  cause: >-
    {downs} players went down within {seconds}s starting at {time} ({since_engage}s into the
    engagement), while the enemy had only {enemy_downs} down(s). {with_stab} of them had
    stability. First downs: {players}.{round_note}
  fix: >-
    Engage only with the full boon setup (stab, aegis, protection, resistance) applied, and
    pre-stack on the tag before contact. If the enemy opens first, bait their bomb and hold yours
    until their cooldowns are used.

cleanse_pressure:
  short: players carried {avg_conditions} conditions on average; {downs_high_condi} downs happened with {down_conditions}+ conditions.
  fix_short: More resistance and burst cleanses for their condi bomb.
  title: "Condition pressure overwhelmed cleanses"
  cause: >-
    Players carried {avg_conditions} conditions on average during the fight (peak
    {peak_conditions}), with {resist}% resistance coverage. {downs_high_condi} downs happened while
    carrying {down_conditions} or more conditions, and {condi_share}% of damage taken was
    condition damage. Squad cleanses: {cleanses} (top: {top_cleansers}).
  fix: >-
    Add resistance uptime and burst cleanses for the moments the enemy's condition bomb lands.
    Assign a cleanser (scrapper, tempest or druid) to every party, and avoid fighting inside
    enemy condition fields.

downstate_own:
  short: '{deaths} of our {downs} downs died; resurrects: {resurrects}.'
  fix_short: Assign rezzers; use banners and downed heals.
  title: "Downed allies were not picked up"
  cause: >-
    {deaths} of {downs} downs ({rate}%) ended in death. Squad resurrects: {resurrects}; healing on
    downed allies: {downed_healing}.{left_note}
  fix: >-
    Assign rezzing (supports and the closest players), and use downed-healing skills and banners.
    Cleave the enemies standing near downed allies so they can rally, and avoid moving the blob
    away from downed players.

downstate_own_gvg:
  short: '{deaths} of our {downs} downs died before the call-off.'
  fix_short: Assign rezzers; use banners and downed heals.
  title: "Downed allies were not picked up"
  cause: >-
    {deaths} of {downs} downs ({rate}%) ended in death before the round was called off.{left_note}
  fix: >-
    Assign rezzing (supports and the closest players), and use downed-healing skills and banners.
    Cleave the enemies standing near downed allies so they can rally, and avoid moving the blob
    away from downed players.

downstate_enemy:
  short: only {enemy_deaths} of {enemy_downs} enemy downs became kills; {escaped} got back up.
  fix_short: Cleave and stomp their downs; CC their res attempts.
  title: "Enemy downs escaped"
  cause: >-
    Only {enemy_deaths} of {enemy_downs} enemy downs ({conversion}%) were turned into kills;
    {escaped} got back up. Damage to downed targets: {against_downed} ({cleave_share}% of squad
    damage).{left_note}
  fix: >-
    After a bomb, push through downed enemies with cleave and stomps, and use CC to stop res
    attempts. Don't retreat immediately after downing them.

downstate_enemy_good:
  short: '{enemy_deaths} of {enemy_downs} enemy downs became kills.'
  title: "Good conversion of enemy downs"
  cause: "{enemy_deaths} of {enemy_downs} enemy downs ({conversion}%) were turned into kills.{left_note}"
  fix: "Keep it up."

sustain_decline:
  short: heals covered {cover_first}% of damage taken in the first half but {cover_second}% after {half_time}; downs went from {downs_first} to {downs_second}.
  fix_short: Pace heal cooldowns; reset when sustain drops.
  title: "Sustain ran out in the second half"
  cause: >-
    Healing + barrier covered {cover_first}% of damage taken in the first half, but only
    {cover_second}% after {half_time}. Downs went from {downs_first} to {downs_second}. Top
    healers: {top_healers}.{round_note}
  fix: >-
    Pace the healers' cooldowns: don't spend every heal in the first exchange. Reset (pull back
    and reapply boons) when sustain drops instead of staying in a long attrition fight.

sustain_low:
  short: heals covered only {cover_all}% of damage taken.
  fix_short: More heal support; shorter, burstier fights.
  title: "Not enough sustain for incoming damage"
  cause: >-
    Healing + barrier covered only {cover_all}% of the damage taken. Total healing: {healing}.
    Top healers: {top_healers}.{round_note}
  fix: >-
    Run more heal support or ask supports to switch to heal builds, and fight in shorter, burstier
    engagements instead of long trades.

comp_audit:
  short: '{party_word} {parties_short} lacked {lacking}; {downs} downs in them.'
  fix_short: Give each party a stab provider and a healer/cleanser.
  title: "Parties without support"
  cause: "{gaps}. Downs in those parties: {downs}. Party compositions: {professions}."
  fix: >-
    Rebalance parties so each one has stability (firebrand), cleanses/healing (scrapper, tempest,
    druid) and boons (herald, chrono). Move players into parties that have a support.

comp_audit_loners:
  short: '{players_txt} in {party_word} {parties} with fewer than 3 members.'
  fix_short: Invite them into full parties with a support.
  title: "Players in tiny parties"
  cause: "{players} players were in parties {parties}, which have fewer than 3 members and likely no support."
  fix: "Invite those players into full parties that have a support, so they get boons and heals."

outnumbered:
  short: '{enemies} enemies against our {squad}{allies_txt} ({ratio}x).'
  fix_short: Use chokes, walls and siege against bigger groups.
  title: "Outnumbered ({ratio}x)"
  cause: >-
    The log saw {enemies} enemies against {squad} squad members and {allies} allies (ratio
    {ratio}x).
  fix: >-
    Against bigger groups, fight at chokes, use siege or walls, and bait the enemy into splitting.
    Avoid open-field fights unless your boons and timing are clearly better.

player_outliers:
  short: '{count_txt} well below others of their class or played far from the tag.'
  fix_short: Check their builds and explain their job.
  title: "Players underperforming in their role"
  cause: "{count} player(s) were well below others of the same profession: {players}."
  fix: >-
    Check build and gear for these players and explain their job (strip timing, stab rotation,
    staying on tag). Pair them with an experienced player of the same class.

# ---- Personal review ("My play", coach/). One player, compared with the rest of the squad
# (survival, distance, CC) or with players of the same spec and job (output, activity) in the
# same fights. {scope_txt} is "in 48 fights" or "this session (12 fights)"; {scope_cap} is the
# same, capitalized.

me_deaths:
  title: "You go down more than the squad{on_spec}"
  cause: >-
    {scope_cap}{on_spec} you went down {downs} times ({deaths} deaths): {per10} downs per 10
    minutes in the fight, against {squad_per10} for the rest of the squad in the same fights
    ({ratio}x). You spent {dead_pct}% of your time dead, the squad
    {squad_dead_pct}%.{spec_txt}{causes_txt}
  fix: >-
    Survival comes first: a dead player gives no output and costs the squad a res. Watch your
    health and pull back to the tag earlier, keep a stun break and a defensive skill for the
    enemy push, and stay inside your party's boons.

me_survivor:
  title: "You stay up"
  cause: >-
    {scope_cap} you went down {downs} times: {per10} downs per 10 minutes against
    {squad_per10} for the rest of the squad in the same fights.

me_down_no_stab:
  title: "Downs without stability while your party had it"
  cause: >-
    {scope_cap}, {hits} of your {downs} downs ({share}%) came with no stability on you while
    most of your party had it. For the rest of the squad, in the same fights, that share
    was {squad_share}%.
  fix: >-
    Stay in range of your party's stability (about 600 from your firebrand), move with the
    party into the push instead of before it, and keep a stun break for when it is stripped.

me_down_far:
  title: "Downs far from the tag"
  cause: >-
    {scope_cap}, {hits} of your {downs} downs ({share}%) were more than {far_tag} from the
    commander. For the rest of the squad, in the same fights, that share was {squad_share}%.
  fix: >-
    Stay on the tag: being out of the blob means no boons, no heals and no cover when the
    enemy turns. Retreat towards the tag, not away from it, and don't chase downed enemies
    past the squad.

me_caught_alone:
  title: "Caught alone"
  cause: >-
    {scope_cap}, {hits} of your {downs} downs ({share}%) happened with at most one other
    squad down within 4 s: you were picked off rather than caught in a bomb. For the rest
    of the squad, in the same fights, that share was {squad_share}%.
  fix: >-
    Watch the flanks and the back of the blob, don't over-extend after a push, and start
    retreating with the squad, not after it.

me_first_down:
  title: "Among the first to go down"
  cause: >-
    In {big_fights} fights with {min_squad_downs}+ squad downs where you went down, you were
    among the first {first} players downed {hits} times. By chance it would be about
    {expected}.
  fix: >-
    The opening is where you get caught: don't enter before the tag and the boons, and stay
    in the middle of your party when the blobs first collide.

me_far_from_tag:
  title: "Far from the tag"
  cause: >-
    In {far_fights} of {tag_fights} fights with a commander you were usually much farther
    from the tag than the squad: typically {you_dist} against the squad's {squad_dist}.
  fix: >-
    Follow the tag closely, especially when it turns or retreats: boons, heals and cleanses
    are aimed at the blob.

me_low_output:
  title: "Low {job_txt} on {spec}"
  cause: >-
    On {spec} your main job was {job_txt}. In {peer_fights} fights with other {spec}s on the
    same job, yours was {you_pct}% of theirs (median).
  fix: >-
    Compare your skill use with a stronger {spec} in the same fights (Offense and Support
    tabs), and check that your build fits the job the squad expects from {spec}.

me_top_output:
  title: "Strong {job_txt} on {spec}"
  cause: >-
    In {peer_fights} fights with other {spec}s on {job_txt}, yours was {you_pct}% of theirs
    (median).

me_low_activity:
  title: "Few skills pressed on {spec}"
  cause: >-
    On {spec} your main job was {job_txt}. In {peer_fights} fights with other {spec}s on the
    same job, you spent {you_cast}% of the time casting skills other than auto-attacks
    against their {peer_cast}% ({you_pct}% of theirs, median).
    Cancelled casts cost you {you_cancel} s per minute, them {peer_cancel} s.
  fix: >-
    Use your skills on cooldown when they do your job, and avoid cancelling casts by moving
    or dodging mid-cast unless you have to.

me_active:
  title: "Active on {spec}"
  cause: >-
    In {peer_fights} fights you spent {you_cast}% of the time casting skills against
    {peer_cast}% for the other {spec}s on {job_txt}.

me_cc_taken:
  title: "CC'd more than the squad"
  cause: >-
    In {cc_fights} fights you received {ratio}x the squad's median crowd control per minute,
    and in {below_fights} of them your stability uptime was below your party's.
  fix: >-
    Stay in range of your party's stability, and keep a stun break or a stability skill for
    the enemy's CC bomb.

me_no_food:
  title: "Missing food or utility"
  cause: >-
    In {missing} of {known} fights ({share}%) you had no food ({no_food}) or no utility
    ({no_utility}).
  fix: >-
    Eat food and use a utility (oil, stone, crystal) before every fight; both are free stats.

me_nothing:
  title: "Nothing stands out {scope_txt}"
  cause: >-
    Compared with the rest of the squad and with players of your spec and job in the same
    fights, none of the checks finds something you do clearly worse. Your numbers are below.

# One hint per down on the fight's "You" tab and in "Your downs" (coach/report.py). A single
# down is never a habit: these say what matched this down, not what you always do.
me_hint_calloff:
  title: "{time}: left downed at the call-off"
  cause: "The round was called while you were down; it is not judged."

me_hint_no_stab:
  title: "{time}: down without stability"
  cause: >-
    You had no stability while {party_stab}% of your party had it just before.
  fix: Stay in range of your party's stability when the push comes.

me_hint_far:
  title: "{time}: down {dist_tag} from the tag"
  cause: You went down far from the commander, outside the blob's boons and heals.
  fix: Fall back to the tag before you take the fight.

me_hint_alone:
  title: "{time}: picked off"
  cause: >-
    {near} other squad member(s) went down within 4 s of you: you were caught alone, not in
    a bomb.
  fix: Watch the flank you are on and retreat with the squad, not after it.

me_hint_low_hp:
  title: "{time}: down from low health"
  cause: You were at {hp_before}% health 3 s before going down.
  fix: Pull back or use a heal and a defensive skill earlier, before the last hit.

me_hint_bomb:
  title: "{time}: down in a bomb"
  cause: >-
    {near} other squad members went down within 4 s of you, with {stab} stability on you:
    a squad-level moment (see the fight's debrief).

me_hint_burst:
  title: "{time}: down in a burst"
  cause: >-
    You were at {hp_before}% health 3 s before, with {stab} stability, and {near} other
    squad member(s) went down within 4 s.
