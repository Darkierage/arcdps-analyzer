[project]
name = "wvw-analyzer"
version = "0.6.0"
description = "Guild Wars 2 arcdps WvW fight analyzer: stats, diagnosis and improvement notes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "watchdog>=5.0",
    "numpy>=2.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "psutil>=6.1",
    "pywebview>=5.3; sys_platform == 'win32'",
]

[project.scripts]
wvw-analyzer = "wvw_analyzer.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/wvw_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
src = ["backend", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is kept verbatim (line breaks would change what the model sees).
"backend/wvw_analyzer/llm/prompts.py" = ["E501"]
